name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet pack src/HouseRules.Analyzers.Package -c Release -o artifacts "-p:Version=${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/*.nupkg

  smoke:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - sdk: 10.0.x
            pin: ""
          - sdk: 8.0.1xx
            pin: 8.0.100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts
      - run: tests/smoke/smoke.sh artifacts
        env:
          SMOKE_SDK: ${{ matrix.pin }}

  github-packages:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts
      - run: >-
          dotnet nuget push artifacts/*.nupkg
          --source https://nuget.pkg.github.com/Hanif6731/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}

  # Trusted publishing (OIDC, no stored API key). Runs only once the repository variable PUBLISH_TO_NUGET_ORG is
  # 'true' and nuget.org has a trusted-publishing policy for this workflow file.
  nuget-org:
    needs: smoke
    if: vars.PUBLISH_TO_NUGET_ORG == 'true'
    runs-on: ubuntu-latest
    environment: nuget-org
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: >-
          dotnet nuget push artifacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
