name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      - name: Generated files match the catalogue
        run: dotnet run --project tools/Generate -c Release --no-build && git diff --exit-code
      - run: dotnet format --verify-no-changes --no-restore
      - name: Line endings are LF
        run: "! git ls-files --eol | grep 'i/crlf'"
      - run: .github/scripts/release-version.test.sh

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet pack src/HouseRules.Analyzers.Package -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/*.nupkg

  smoke-sdk10:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The newest SDK 10, and 10.0.1xx: its Roslyn 5.0 is the oldest compiler the package supports.
          - sdk: 10.0.x
            pin: ""
          - sdk: 10.0.1xx
            pin: 10.0.100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts
      - run: tests/smoke/smoke.sh artifacts
        env:
          SMOKE_SDK: ${{ matrix.pin }}
